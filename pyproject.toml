[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyedit"
version = "0.2.0"
description = "Multi-file edit CLI and library for AI agents: scripted edits, dry-run diffs, apply on request."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "cffi>=1.16",
  "pathspec>=0.12",
  "rope>=1.11",
  "pygit2>=1.14",
  "pygls>=2.0",
  "lsprotocol>=2025.0",
  "tree-sitter>=0.25",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "tree-sitter-tsx",
  "tree-sitter-go",
  "tree-sitter-rust",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-bash",
  "tree-sitter-json",
  "tree-sitter-yaml",
  "tree-sitter-toml",
  "tree-sitter-nix",
  "tree-sitter-ruby",
  "tree-sitter-java",
  "tree-sitter-lua",
  "tree-sitter-zig",
]

[project.scripts]
pyedit = "pyedit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # our own code must stay warning-clean; new deprecations fail tests
  "error",
  # pygls 2.1.1 calls asyncio.iscoroutinefunction (removed in 3.16);
  # theirs to fix, ignore until the pin moves
  "ignore::DeprecationWarning:pygls",
  # rope deprecates its own internals with the same marker
  "ignore::DeprecationWarning:rope",
]
